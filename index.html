<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chess helper</title>
<style>
  body { font-family: sans-serif; margin: 8px; }
  button, select { font-size: 16px; margin: 2px; }
  #info { font-family: monospace; font-size: 12px; margin: 2px 0; }
  #big { font-size: 22px; font-weight: bold; margin: 4px 0; min-height: 28px; }
</style>
</head>
<body>
<button id="start">1. Share screen</button>
<button id="learn">3. Learn pieces</button>
<label>Move for:
  <select id="side">
    <option value="auto">Auto</option>
    <option value="w">White</option>
    <option value="b">Black</option>
  </select>
</label>
<label>Strength:
  <select id="skill">
    <option value="20">Max</option>
    <option value="14">Strong</option>
    <option value="8">Club player</option>
    <option value="3">Beginner</option>
  </select>
</label>
<label><input type="checkbox" id="flip"> White is at the top</label>
<label><input type="checkbox" id="multi" checked> Show top 3</label>
<label><input type="checkbox" id="debug"> Show what it sees</label>
<p id="msg">Click "1. Share screen" and pick the Roblox window.</p>
<div id="big"></div>
<p id="info"></p>
<canvas id="c" style="max-width:100%"></canvas>
<video id="v" autoplay muted style="display:none"></video>

<script>
const N = 32;
const v = document.getElementById("v");
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const msgEl = document.getElementById("msg");
const infoEl = document.getElementById("info");
const bigEl = document.getElementById("big");
const sideEl = document.getElementById("side");
const skillEl = document.getElementById("skill");
const flipEl = document.getElementById("flip");
const multiEl = document.getElementById("multi");
const debugEl = document.getElementById("debug");
const sq = document.createElement("canvas");
sq.width = sq.height = N;
const sctx = sq.getContext("2d", { willReadFrequently: true });

let corners = [], templates = [], bgPar = null, lumThr = 120;
let ready = false, engine = null, lines = {}, chosen = null;
let lastGrid = null, autoSide = "w", sideToMove = "w", lastFen = "";
let candidate = "", count = 0, analyzed = "";
let searching = false, pending = null;

const say = (t) => (msgEl.textContent = t);
function median(a) { a = a.slice().sort((x, y) => x - y); return a[a.length >> 1]; }
function cdist(p, q) { return Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) + Math.abs(p[2] - q[2]); }

skillEl.onchange = () => { analyzed = ""; };

// ---------- screen share ----------
document.getElementById("start").onclick = async () => {
  const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
  v.srcObject = stream;
  v.onloadedmetadata = () => {
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    ready = true;
    say("2. Click the TOP-LEFT corner of the board, then the BOTTOM-RIGHT corner.");
    draw();
  };
  loadEngine();
};

c.onclick = (e) => {
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) * c.width / r.width;
  const y = (e.clientY - r.top) * c.height / r.height;
  if (corners.length >= 2) { corners = []; templates = []; lines = {}; chosen = null; }
  corners.push({ x, y });
  say(corners.length === 1
    ? "Now click the BOTTOM-RIGHT corner."
    : "Check the red grid, then with the game at the START position click '3. Learn pieces'.");
};

function rect() {
  const [p, q] = corners;
  const x0 = Math.min(p.x, q.x), y0 = Math.min(p.y, q.y);
  const x1 = Math.max(p.x, q.x), y1 = Math.max(p.y, q.y);
  return { x: x0, y: y0, w: (x1 - x0) / 8, h: (y1 - y0) / 8 };
}

// ---------- engine ----------
async function loadEngine() {
  if (engine) return;
  try {
    const url = "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js";
    const code = await (await fetch(url)).text();
    const blob = new Blob([code], { type: "application/javascript" });
    engine = new Worker(URL.createObjectURL(blob));
    engine.onmessage = (e) => {
      const line = typeof e.data === "string" ? e.data : "";
      if (line.startsWith("info") && line.includes(" pv ")) {
        if (pending) return; // stale info from a search we are stopping
        const mp = line.match(/multipv (\d+)/);
        const sc = line.match(/score (cp|mate) (-?\d+)/);
        const dp = line.match(/depth (\d+)/);
        const pv = line.split(" pv ")[1].split(" ");
        if (sc) lines[mp ? +mp[1] : 1] = { move: pv[0], type: sc[1], val: +sc[2], depth: dp ? +dp[1] : 0 };
      }
      if (line.startsWith("bestmove")) {
        searching = false;
        if (pending) { const p = pending; pending = null; run(p); }
        else chosen = line.split(" ")[1];
      }
    };
    engine.postMessage("uci");
  } catch (err) {
    say("Engine failed to load: " + err + " (tell me and we'll host the engine in your repo instead)");
  }
}
function analyze(fen) {
  lines = {}; chosen = null;
  if (searching) { pending = fen; engine.postMessage("stop"); return; }
  run(fen);
}
function run(fen) {
  searching = true; lines = {}; chosen = null;
  engine.postMessage("setoption name MultiPV value 3");
  engine.postMessage("setoption name Skill Level value " + skillEl.value);
  engine.postMessage("position fen " + fen);
  engine.postMessage("go movetime 1200");
}

// ---------- reading the board ----------
function cornerBg(d) {
  // colour of this square's own empty background, taken from its 4 corners
  const spots = [[1, 1], [N - 4, 1], [1, N - 4], [N - 4, N - 4]];
  const cols = spots.map(([x0, y0]) => {
    const s = [0, 0, 0];
    for (let y = y0; y < y0 + 3; y++) for (let x = x0; x < x0 + 3; x++) {
      const i = (y * N + x) * 4; s[0] += d[i]; s[1] += d[i + 1]; s[2] += d[i + 2];
    }
    return s.map(t => t / 9);
  });
  let best = cols[0], bs = 1e9;
  for (const a of cols) {
    let t = 0; for (const b of cols) t += cdist(a, b);
    if (t < bs) { bs = t; best = a; }
  }
  return best;
}

function readSquares() {
  const R = rect(), out = [];
  for (let r = 0; r < 8; r++) {
    out.push([]);
    for (let f = 0; f < 8; f++) {
      sctx.drawImage(v, R.x + f * R.w, R.y + r * R.h, R.w, R.h, 0, 0, N, N);
      const d = sctx.getImageData(0, 0, N, N).data;
      out[r].push({ d, bg: cornerBg(d) });
    }
  }
  return out;
}

function silhouette(d, bg) {
  const T = 55;
  const bgLike = new Uint8Array(N * N);
  for (let i = 0; i < N * N; i++) {
    bgLike[i] = cdist([d[i * 4], d[i * 4 + 1], d[i * 4 + 2]], bg) < T ? 1 : 0;
  }
  const outside = new Uint8Array(N * N), stack = [];
  const seed = (p) => { if (bgLike[p] && !outside[p]) { outside[p] = 1; stack.push(p); } };
  for (let i = 0; i < N; i++) { seed(i); seed((N - 1) * N + i); seed(i * N); seed(i * N + N - 1); }
  while (stack.length) {
    const p = stack.pop(), x = p % N, y = (p / N) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const q = ny * N + nx;
      if (bgLike[q] && !outside[q]) { outside[q] = 1; stack.push(q); }
    }
  }
  const sil = new Uint8Array(N * N); let cnt = 0;
  for (let i = 0; i < N * N; i++) { sil[i] = outside[i] ? 0 : 1; cnt += sil[i]; }
  return { sil, cnt };
}

function centerFill(sil) {
  const lo = (N * 0.25) | 0, hi = (N * 0.75) | 0;
  let s = 0, a = 0;
  for (let y = lo; y < hi; y++) for (let x = lo; x < hi; x++) { a++; s += sil[y * N + x]; }
  return s / a;
}

function pieceLum(d, sil) {
  const lo = (N * 0.3) | 0, hi = (N * 0.7) | 0, l = [];
  for (let y = lo; y < hi; y++) for (let x = lo; x < hi; x++) {
    const i = y * N + x;
    if (sil[i]) l.push(0.3 * d[i * 4] + 0.59 * d[i * 4 + 1] + 0.11 * d[i * 4 + 2]);
  }
  return l.length ? median(l) : 0;
}

function matchDist(a, b) {
  let best = 1e9;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    let m = 0;
    for (let y = 0; y < N; y++) {
      const yy = y + dy; if (yy < 0 || yy >= N) continue;
      for (let x = 0; x < N; x++) {
        const xx = x + dx; if (xx < 0 || xx >= N) continue;
        if (a[y * N + x] !== b[yy * N + xx]) m++;
      }
    }
    if (m < best) best = m;
  }
  return best;
}

document.getElementById("learn").onclick = () => {
  if (corners.length < 2) { say("Click the two board corners first."); return; }
  const sqs = readSquares();

  // reference colours (for spotting highlighted squares) from the empty middle
  const cols = [[], []];
  for (let r = 2; r <= 5; r++) for (let f = 0; f < 8; f++) cols[(r + f) % 2].push(sqs[r][f].bg);
  bgPar = cols.map(l => [0, 1, 2].map(k => median(l.map(x => x[k]))));

  // sanity check: 32 pieces at the edges, nothing in the middle
  let bad = 0;
  const sils = {};
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const s = sqs[r][f], { sil, cnt } = silhouette(s.d, s.bg);
    sils[r + "," + f] = sil;
    const filled = centerFill(sil) >= 0.3 && cnt / (N * N) <= 0.85;
    const shouldHave = (r <= 1 || r >= 6);
    if (filled !== shouldHave) bad++;
  }
  if (bad > 2) {
    say("I can't see the normal starting position (" + bad + " squares look wrong). Make sure the game is at the START position and the two corner clicks are on the board's outer corners, then try again.");
    return;
  }

  // who is on top? (white pieces are brighter)
  const top = [], bot = [];
  for (const r of [0, 1, 6, 7]) for (let f = 0; f < 8; f++) {
    const l = pieceLum(sqs[r][f].d, sils[r + "," + f]);
    (r <= 1 ? top : bot).push(l);
  }
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const whiteTop = avg(top) > avg(bot);
  flipEl.checked = whiteTop;
  lumThr = (avg(top) + avg(bot)) / 2;

  const back = whiteTop ? "rnbkqbnr" : "rnbqkbnr";
  templates = [];
  for (const r of [0, 1, 6, 7]) for (let f = 0; f < 8; f++) {
    const t = (r === 0 || r === 7) ? back[f] : "p";
    templates.push({ t, s: sils[r + "," + f] });
  }
  analyzed = ""; candidate = ""; lines = {}; chosen = null;
  say("Learned! White is at the " + (whiteTop ? "top" : "bottom") + ". It's now reading the board. Turn on 'Show what it sees' to check the letters.");
};

function classify(s) {
  const { sil, cnt } = silhouette(s.d, s.bg);
  if (centerFill(sil) < 0.3 || cnt / (N * N) > 0.85) return "";
  let bt = "", bd = 1e9;
  const perType = {};
  for (const t of templates) {
    const d = matchDist(sil, t.s);
    if (perType[t.t] === undefined || d < perType[t.t]) perType[t.t] = d;
  }
  for (const t in perType) if (perType[t] < bd) { bd = perType[t]; bt = t; }
  return pieceLum(s.d, sil) > lumThr ? bt.toUpperCase() : bt;
}

function normalize(grid) {
  const flip = flipEl.checked, b = [];
  for (let i = 0; i < 8; i++) {
    const line = grid[flip ? 7 - i : i].slice();
    if (flip) line.reverse();
    b.push(line);
  }
  return b; // b[0] = rank 8, b[0][0] = a8
}

function valid(b) {
  const flat = b.flat(), n = (ch) => flat.filter(x => x === ch).length;
  if (n("K") !== 1 || n("k") !== 1) return false;
  if (n("P") > 8 || n("p") > 8) return false;
  if (b[0].some(x => x === "P" || x === "p") || b[7].some(x => x === "P" || x === "p")) return false;
  return true;
}

function makeFen(b, side) {
  const rows = b.map(line => {
    let s = "", e = 0;
    for (const p of line) { if (p === "") e++; else { if (e) s += e; e = 0; s += p; } }
    if (e) s += e;
    return s;
  });
  let castle = "";
  if (b[7][4] === "K" && b[7][7] === "R") castle += "K";
  if (b[7][4] === "K" && b[7][0] === "R") castle += "Q";
  if (b[0][4] === "k" && b[0][7] === "r") castle += "k";
  if (b[0][4] === "k" && b[0][0] === "r") castle += "q";
  return rows.join("/") + " " + side + " " + (castle || "-") + " - 0 1";
}

// the game highlights the last move: the highlighted square holding a piece shows who moved
function detectSide(grid, hl) {
  if (hl.length !== 2) return null;
  const withPiece = hl.filter(([r, f]) => grid[r][f] !== "");
  if (withPiece.length !== 1) return null;
  const p = grid[withPiece[0][0]][withPiece[0][1]];
  return p === p.toUpperCase() ? "b" : "w";
}

// ---------- main loop ----------
setInterval(() => {
  if (!ready || corners.length < 2 || !templates.length) return;
  const sqs = readSquares(), grid = [], hl = [];
  for (let r = 0; r < 8; r++) {
    grid.push([]);
    for (let f = 0; f < 8; f++) {
      const s = sqs[r][f];
      grid[r].push(classify(s));
      if (cdist(s.bg, bgPar[(r + f) % 2]) > 35) hl.push([r, f]);
    }
  }
  lastGrid = grid;
  const b = normalize(grid);
  if (!valid(b)) {
    bigEl.textContent = "";
    infoEl.textContent = "Can't read the board right now (need exactly one king each). Is a piece being dragged?";
    return;
  }
  let side = sideEl.value;
  if (side === "auto") { const d = detectSide(grid, hl); if (d) autoSide = d; side = autoSide; }
  sideToMove = side;
  const fen = makeFen(b, side);
  lastFen = fen;
  if (fen === candidate) count++; else { candidate = fen; count = 1; }
  if (count >= 2 && candidate !== analyzed && engine) {
    analyzed = candidate;
    analyze(candidate);
  }
  updateText();
}, 400);

function evalText(l) {
  if (!l) return "";
  const sgn = sideToMove === "w" ? 1 : -1;
  if (l.type === "mate") return "mate in " + Math.abs(l.val) + (l.val * sgn > 0 ? " for White" : " for Black");
  const e = l.val * sgn / 100;
  return (e > 0 ? "+" : "") + e.toFixed(2) + " (White's view)";
}
function updateText() {
  const main = chosen || (lines[1] && lines[1].move);
  const l = Object.values(lines).find(x => x.move === main) || lines[1];
  if (main) {
    bigEl.textContent = (sideToMove === "w" ? "White" : "Black") + ": " + main.slice(0, 2) + " → " + main.slice(2, 4) +
      "   eval " + evalText(l) + (l ? "  depth " + l.depth : "");
  } else {
    bigEl.textContent = engine ? "Thinking..." : "Loading engine...";
  }
  infoEl.textContent = lastFen;
}

// ---------- drawing ----------
function center(s) {
  const R = rect(), flip = flipEl.checked;
  const f = s.charCodeAt(0) - 97, rk = +s[1];
  const col = flip ? 7 - f : f, row = flip ? rk - 1 : 8 - rk;
  return { x: R.x + (col + 0.5) * R.w, y: R.y + (row + 0.5) * R.h };
}
function arrow(a, b, color, width, alpha) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  const ang = Math.atan2(b.y - a.y, b.x - a.x), h = width * 3;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - h * Math.cos(ang - 0.4), b.y - h * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - h * Math.cos(ang + 0.4), b.y - h * Math.sin(ang + 0.4));
  ctx.fill(); ctx.globalAlpha = 1;
}
function draw() {
  ctx.drawImage(v, 0, 0, c.width, c.height);
  if (corners.length === 2) {
    const R = rect();
    if (!templates.length) {
      ctx.strokeStyle = "red"; ctx.lineWidth = 2;
      for (let i = 0; i <= 8; i++) {
        ctx.beginPath(); ctx.moveTo(R.x + i * R.w, R.y); ctx.lineTo(R.x + i * R.w, R.y + 8 * R.h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(R.x, R.y + i * R.h); ctx.lineTo(R.x + 8 * R.w, R.y + i * R.h); ctx.stroke();
      }
    } else {
      if (debugEl.checked && lastGrid) {
        ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "magenta";
        for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
          if (lastGrid[r][f]) ctx.fillText(lastGrid[r][f], R.x + f * R.w + 4, R.y + r * R.h + 20);
        }
      }
      const main = chosen || (lines[1] && lines[1].move);
      if (multiEl.checked) {
        [1, 2, 3].forEach((k) => {
          const l = lines[k];
          if (l && l.move !== main && l.move.length >= 4) {
            arrow(center(l.move.slice(0, 2)), center(l.move.slice(2, 4)), k === 2 ? "gold" : "orange", 5, 0.6);
          }
        });
      }
      if (main && main.length >= 4) arrow(center(main.slice(0, 2)), center(main.slice(2, 4)), "lime", 10, 0.85);
    }
  }
  requestAnimationFrame(draw);
}
</script>
</body>
</html>
