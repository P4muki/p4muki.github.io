
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KNIGHT — Chess Vision</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d14;color:#e9efff;font-family:Inter,Arial,sans-serif}
header{height:75px;border-bottom:1px solid #202b3c;display:flex;align-items:center;padding:0 7%;justify-content:space-between}
.logo{font-size:23px;font-weight:900;letter-spacing:3px}
.logo span{color:#62e6bd}
.status{color:#62e6bd;font-size:12px}
main{max-width:1050px;margin:45px auto;padding:20px;display:grid;grid-template-columns:minmax(280px,560px) minmax(250px,1fr);gap:35px}
h1{font-size:32px;margin:0 0 8px}
.sub{color:#8794aa;margin-bottom:25px}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:5px solid #202b3c;border-radius:9px;overflow:hidden}
.square{display:flex;align-items:center;justify-content:center;font-size:clamp(24px,5vw,55px);cursor:pointer;position:relative;user-select:none}
.light{background:#dce5df}.dark{background:#628b7d}
.selected{outline:4px solid #ffe16a;outline-offset:-4px}
.target:after{content:"";width:22%;height:22%;border-radius:50%;background:#142c2780;position:absolute}
.panel{background:#111a28;border:1px solid #25344a;border-radius:15px;padding:22px}
.panel h2{font-size:17px;margin:0 0 18px}
button{background:#62e6bd;color:#08130f;border:0;padding:13px 17px;border-radius:8px;font-weight:800;cursor:pointer}
button:hover{filter:brightness(1.1)}
.secondary{background:#243449;color:white}
.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.result{margin-top:18px;padding:16px;background:#0b1320;border-radius:10px;min-height:100px}
.big{font-size:25px;font-weight:800;color:#62e6bd}
.muted{color:#91a0b6;font-size:13px;line-height:1.6}
input{width:100%;background:#0a111c;color:white;border:1px solid #34445b;padding:12px;border-radius:8px;margin:8px 0}
.moves{color:#aebbd0;line-height:1.8;word-break:break-word}
footer{text-align:center;color:#65748a;padding:20px;font-size:12px}
@media(max-width:750px){main{grid-template-columns:1fr;margin:15px auto;gap:20px}}
</style>
</head>
<body>
<header>
 <div class="logo">KNIGHT<span>.</span></div>
 <div class="status">● VISION SYSTEM READY</div>
</header>
<main>
<section>
 <h1>Chess Analysis</h1>
 <div class="sub">Your personal chess analysis workspace.</div>
 <div id="board" class="board"></div>
 <div class="controls">
  <button onclick="analyze()">Analyze position</button>
  <button class="secondary" onclick="undo()">Undo move</button>
  <button class="secondary" onclick="reset()">New game</button>
 </div>
</section>
<section>
 <div class="panel">
  <h2>AI ANALYSIS</h2>
  <div class="muted">Select pieces on the board to make moves, then analyze the position.</div>
  <div class="result" id="result">
   <div class="big">READY</div>
   <p class="muted">Make a move to get started.</p>
  </div>
  <h2 style="margin-top:25px">POSITION FEN</h2>
  <input id="fen" placeholder="Paste a FEN position here">
  <button class="secondary" onclick="loadFen()">Load FEN</button>
  <h2 style="margin-top:25px">MOVE HISTORY</h2>
  <div id="history" class="moves">No moves yet.</div>
 </div>
</section>
</main>
<footer>KNIGHT VISION · CHESS WORKSPACE</footer>
<script>
const game = new Chess();
const board = document.getElementById("board");
const pieces = {
 w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},
 b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}
};
let selected=null;
let targets=[];

function render(){
 board.innerHTML="";
 const rows=game.board();
 rows.forEach((row,r)=>{
  row.forEach((piece,c)=>{
   const sq=String.fromCharCode(97+c)+(8-r);
   const el=document.createElement("div");
   el.className="square "+((r+c)%2===0?"light":"dark");
   if(selected===sq)el.classList.add("selected");
   if(targets.includes(sq))el.classList.add("target");
   if(piece){
    el.textContent=pieces[piece.color][piece.type];
    el.style.color=piece.color==="w"?"#fff":"#151a20";
    el.style.textShadow=piece.color==="w"?"0 1px 3px #333":"0 1px 2px #aaa";
   }
   el.onclick=()=>clickSquare(sq);
   board.appendChild(el);
  });
 });
 document.getElementById("fen").value=game.fen();
 const history=game.history();
 document.getElementById("history").textContent=history.length?history.join("  "):"No moves yet.";
}
function clickSquare(sq){
 const piece=game.get(sq);
 if(selected){
  const move=game.move({from:selected,to:sq,promotion:"q"});
  if(move){selected=null;targets=[];render();return;}
 }
 if(piece&&piece.color===game.turn()){
  selected=sq;
  targets=game.moves({square:sq,verbose:true}).map(m=>m.to);
 }else{selected=null;targets=[];}
 render();
}
function undo(){
 game.undo();selected=null;targets=[];render();
}
function reset(){
 game.reset();selected=null;targets=[];render();
 document.getElementById("result").innerHTML='<div class="big">READY</div><p class="muted">New game started.</p>';
}
function loadFen(){
 const value=document.getElementById("fen").value.trim();
 if(game.load(value)){selected=null;targets=[];render();document.getElementById("result").innerHTML='<div class="big">POSITION LOADED</div><p class="muted">Ready to analyze.</p>';}
 else alert("That FEN position is not valid.");
}
async function analyze(){
 const box=document.getElementById("result");
 box.innerHTML='<div class="big">ANALYZING...</div><p class="muted">Checking the current chess position.</p>';
 if(game.game_over()){
  box.innerHTML='<div class="big">GAME OVER</div><p class="muted">This position has no legal continuation.</p>';
  return;
 }
 try{
  const fen=encodeURIComponent(game.fen());
  const response=await fetch("https://lichess.org/api/cloud-eval?fen="+fen+"&multiPv=3");
  if(!response.ok)throw new Error("No cloud analysis available");
  const data=await response.json();
  const names={};
  const lines=data.pvs||[];
  let html='<div class="big">ANALYSIS READY</div>';
  html+='<p class="muted">Engine depth: '+(data.depth||"?")+'</p>';
  html+='<h3>Suggested moves</h3>';
  lines.forEach((line,i)=>{
   const first=line.moves.split(" ")[0];
   html+='<p><b>'+(i+1)+'. '+first+'</b> <span class="muted"> · '+(line.cp!==undefined?(line.cp/100).toFixed(2):"Mate")+'</span></p>';
  });
  html+='<p class="muted">Evaluation is from White’s perspective. Cloud analysis may not be available for every position.</p>';
  box.innerHTML=html;
 }catch(e){
  box.innerHTML='<div class="big">ANALYSIS UNAVAILABLE</div><p class="muted">The online analysis service could not find this position. Check your internet connection or try again later.</p>';
 }
}
render();
</script>
</body>
</html>
