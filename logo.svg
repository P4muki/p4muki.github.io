<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="orb" cx="40%" cy="30%" r="85%">
      <stop offset="0" stop-color="#b9ecff"/>
      <stop offset="0.35" stop-color="#4cc3f7"/>
      <stop offset="0.75" stop-color="#1573d6"/>
      <stop offset="1" stop-color="#0a3f94"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6f56a"/>
      <stop offset="0.55" stop-color="#4fcf5d"/>
      <stop offset="1" stop-color="#1c9a56"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.82" stop-color="#7be7ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#9ff3ff" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="bounce" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#8ff7e0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8ff7e0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="256" cy="256" r="224"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <ellipse cx="256" cy="476" rx="150" ry="18" fill="#0a3f94" opacity="0.35" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="224" fill="url(#orb)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="256" cy="520" rx="260" ry="200" fill="url(#bounce)"/>
    <!-- rolling hill -->
    <path d="M0 360 C110 310 210 330 300 372 C380 408 450 396 512 352 L512 512 L0 512 Z" fill="url(#grass)"/>
    <path d="M0 360 C110 310 210 330 300 372 C380 408 450 396 512 352" fill="none" stroke="#e6ffb8" stroke-width="3" opacity="0.7"/>
    <!-- leaf / wing swoosh -->
    <path d="M150 300 C170 190 280 130 372 150 C352 232 276 300 150 300 Z" fill="#fff" opacity="0.92"/>
    <path d="M150 300 C230 250 300 200 372 150" fill="none" stroke="#7fd3ff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M196 262 C232 238 262 218 300 190" fill="none" stroke="#bfeaff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
  <circle cx="256" cy="256" r="224" fill="url(#rim)"/>
  <!-- top gloss -->
  <path d="M96 210 C100 120 170 52 256 52 C342 52 412 120 416 210 C360 160 152 160 96 210 Z" fill="url(#gloss)"/>
  <!-- bubbles -->
  <g fill="#fff" opacity="0.9">
    <circle cx="392" cy="120" r="18" fill-opacity="0.35" stroke="#fff" stroke-opacity="0.9" stroke-width="3"/>
    <circle cx="436" cy="168" r="9" fill-opacity="0.35" stroke="#fff" stroke-opacity="0.9" stroke-width="2"/>
    <circle cx="116" cy="400" r="12" fill-opacity="0.3" stroke="#fff" stroke-opacity="0.9" stroke-width="2.5"/>
  </g>
  <circle cx="386" cy="114" r="5" fill="#fff"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
</svg>
